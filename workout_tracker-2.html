<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grind Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0f;--s1:#161618;--s2:#1e1e21;--bd:#2a2a2e;--tx:#f0f0f0;--mu:#8a8a92;--up:#3a86ff;--lo:#2dc653;--fu:#e63946;--ca:#9b5de5;--bb:#ff8c1a;--ok:#2dc653;--sick:#ffc233}
[data-theme=light]{--bg:#f4f4f6;--s1:#fff;--s2:#ececf0;--bd:#d8d8de;--tx:#18181b;--mu:#62626b;--ok:#1f9d42;--sick:#e0a000}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:90px}
button{font-family:inherit;cursor:pointer}
.header{background:var(--s1);border-bottom:1px solid var(--bd);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;background:linear-gradient(90deg,#e63946,#3a86ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hr{display:flex;align-items:center;gap:12px}
.hd{font-size:12px;color:var(--mu);text-align:right}.hd b{display:block;color:var(--tx);font-size:14px}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:16px}
.banner{margin:14px 16px 8px;padding:14px 16px;border-radius:12px;background:var(--s1);border:1px solid var(--bd)}
.wn{display:flex;align-items:center;gap:10px}
.nb{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:16px}
.nb:disabled{opacity:.25}
.wl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px}
.ph{font-size:12px;color:var(--mu);margin:6px 0 10px}
.note{font-size:11px;color:var(--ca);margin-bottom:8px}.note button{background:none;border:none;color:var(--ca);text-decoration:underline;font-weight:600;font-size:11px}
.dots{display:flex;gap:8px;justify-content:space-between}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--c,var(--bd));color:var(--c,var(--mu));font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dot.done{background:var(--c);color:#fff}.dot.sick{background:var(--sick);border-color:var(--sick);color:#000}
.legend{display:flex;gap:16px;justify-content:center;margin:0 16px 10px;font-size:12px;color:var(--mu)}
.legend span{display:flex;align-items:center;gap:6px}
.d{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd);display:inline-block}.d.ok{background:var(--ok);border-color:var(--ok)}.d.sk{background:var(--sick);border-color:var(--sick)}
.tabs{display:flex;overflow-x:auto;gap:6px;margin:0 16px 14px;padding-bottom:2px;scrollbar-width:none}
.tab{flex:0 0 auto;padding:9px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--s1);color:var(--mu);font-size:12px;font-weight:700}
.tab.on{background:var(--c,var(--s2));border-color:var(--c,var(--bd));color:#fff}
.main{padding:0 16px}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.status{padding:14px;border-radius:12px;margin-bottom:12px;border:1px solid var(--ok);background:var(--s1);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:600}
.status.sick{border-color:var(--sick)}.status small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:2px}
.status button{background:none;border:1px solid var(--bd);color:var(--mu);padding:7px 12px;border-radius:8px;font-size:12px}
.scheme,.card2{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.55}
.scheme b,.card2 h3{display:block;font-size:14px;margin-bottom:4px}
.card2 ol{padding-left:18px}.card2 li{margin:3px 0}.m{color:var(--mu);font-size:12px;margin-top:8px}
.sec{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-size:18px;color:var(--mu);margin:14px 0 8px}
.ss{border:1px dashed var(--bb);border-radius:14px;padding:8px 8px 0;margin-bottom:12px}.ss .card{background:var(--s2)}
.sst{font-size:11px;font-weight:700;color:var(--bb);margin:0 4px 8px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card.ok{border-color:var(--ok)}
.ch{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.card.ok .chk{background:var(--ok);border-color:var(--ok);color:#000}
.ci{flex:1;min-width:0}.cn{font-size:15px;font-weight:700}.cs{font-size:12px;color:var(--mu);margin-top:2px}
.ar{color:var(--mu);transition:transform .2s}.card.open .ar{transform:rotate(180deg)}
.cd{display:none;border-top:1px solid var(--bd);padding:12px 14px}.card.open .cd{display:block}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sl{flex:1;font-size:13px}.sl span{display:block;font-size:11px;color:var(--mu)}
.sr input{width:110px;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:16px;text-align:center}
.sr input:focus{outline:none;border-color:var(--ca)}
.sug{font-size:12px;color:var(--mu);margin:6px 0 10px}.sug b{color:var(--tx)}
.sug button{margin-left:6px;background:var(--ca);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700}
.tip{font-size:13px;line-height:1.55;padding:10px 12px;background:var(--s2);border-radius:8px;border-left:3px solid var(--bd);margin-bottom:10px}
.yt{display:inline-block;background:#f00;color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600}
.act{display:flex;gap:10px;margin-top:6px}
.cbtn{flex:2;padding:15px;border:none;border-radius:12px;background:var(--c);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px}
.sbtn{flex:1;padding:15px 8px;border-radius:12px;border:1px solid var(--sick);background:none;color:var(--sick);font-size:13px;font-weight:700}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:11px;border:none;background:none;color:var(--mu);font-size:13px;font-weight:700}.seg .on{background:var(--ca);color:#fff}
.hw{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.ht{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}.ht b{font-size:15px}.ht small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.ht button{background:none;border:1px solid var(--bd);color:var(--tx);padding:6px 10px;border-radius:8px;font-size:12px}
.stats{display:flex;gap:10px;margin-bottom:12px}.stats div{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font-size:11px;color:var(--mu)}.stats b{display:block;font-size:22px;color:var(--tx)}
.set{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.set h3{font-size:15px;margin-bottom:4px}.set p{font-size:13px;color:var(--mu);margin-bottom:10px;line-height:1.5}
.set input[type=date],.set input[type=time]{width:100%;padding:12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:15px;margin-bottom:8px}
.sb{width:100%;padding:12px;background:var(--ca);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;margin-top:6px}
.sb.alt{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--s1);border:1px solid var(--bd);border-radius:30px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.rest span{flex:1;font-weight:700;font-size:14px}.rest button{border:1px solid var(--bd);background:var(--s2);color:var(--tx);border-radius:18px;padding:8px 12px;font-size:12px;font-weight:700}
.rest.go{border-color:var(--ok)}
.mv{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:11px;color:var(--mu)}.mv button{border:1px solid var(--bd);background:var(--s1);color:var(--tx);border-radius:18px;padding:8px 12px;font-size:12px;font-weight:700}.mv button:disabled{opacity:.3}
.cf{position:fixed;inset:0;pointer-events:none;z-index:99}
.cp{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="header">
  <div class="title">GRIND TRACKER</div>
  <div class="hr"><div class="hd" id="hd"></div><button class="theme" id="theme" onclick="toggleTheme()" aria-label="Toggle light/dark mode"></button></div>
</div>
<div class="banner">
  <div class="wn"><button class="nb" id="back" onclick="navWeek(-1)" aria-label="Previous week">‹</button><div class="wl" id="wl"></div><button class="nb" id="fwd" onclick="navWeek(1)" aria-label="Next week">›</button></div>
  <div class="ph" id="ph"></div>
  <div class="note" id="note"></div>
  <div class="dots" id="dots"></div>
</div>
<div class="legend"><span><i class="d ok"></i>Done</span><span><i class="d sk"></i>Sick day</span><span><i class="d"></i>To do</span></div>
<div class="tabs" id="tabs"></div>
<div class="main" id="main"></div>
<div class="rest" id="rest"><span id="rt">⏱ Rest timer</span><button onclick="rest(60)">60s</button><button onclick="rest(90)">90s</button><button onclick="rest(120)">2m</button></div>
<div class="cf" id="cf"></div>

<script>
// ============ PROGRAM DATA ============
const NEW=17; // first week of the new program
const SES=[
 {id:'upper',tab:'Upper',L:'U',name:'Upper Body',c:'--up',t:'lift'},
 {id:'lower',tab:'Lower',L:'L',name:'Lower Body',c:'--lo',t:'lift'},
 {id:'full',tab:'Full Body',L:'F',name:'Full Body',c:'--fu',t:'lift'},
 {id:'c1',tab:'Cardio 1',L:'C',name:'Cardio 1',c:'--ca',t:'cardio',n:0},
 {id:'c2',tab:'Cardio 2',L:'C',name:'Cardio 2',c:'--ca',t:'cardio',n:1},
 {id:'c3',tab:'Cardio 3',L:'C',name:'Cardio 3',c:'--ca',t:'cardio',n:2}];
const DEFAULT_ORDER=['upper','c1','lower','c2','full','c3'];
const REPS=['10–12 reps · warm-up','6–8 reps · stop 2–3 shy of failure','4–6 reps · to failure (0 left)'];
// id: [name, muscles, tip, youtube search, flag]  (a = assisted: less weight is progress, n = no auto suggestion)
const EX={
 pullup:['Assisted Pull-Up','Back · Lats','The number is assistance, so LESS assist = progress. Start from a full hang, chest toward the bar, no swinging.','assisted pull up machine proper form','a'],
 row:['Single-Arm DB Row','Back · Lats, rhomboids','Brace a hand on the bench. Pull your elbow toward your hip, squeeze, lower slowly. Log the weight of one dumbbell.','one arm dumbbell row proper form'],
 incline:['DB Incline Chest Press','Upper chest · Triceps','Bench at 30–45°. Lower under control to chest level, press up without flaring your elbows.','dumbbell incline bench press proper form'],
 fly:['Pec Fly','Chest','Soft elbows, like hugging a big tree. Feel the stretch, squeeze in the middle.','pec fly machine proper form'],
 raise:['Cable Side Raise','Side delts','Lead with the elbow up to shoulder height. Slow lowering, no swinging.','cable lateral raise proper form'],
 curl:['Bicep Curl','Biceps','No body swing. Full range: all the way down, squeeze at the top.','dumbbell bicep curl proper form'],
 push:['Bar Pushdown','Triceps','Elbows pinned to your sides. Full lockout at the bottom, slow return.','cable bar tricep pushdown form'],
 lpress:['Leg Press','Quads · Glutes','Feet shoulder-width, lower to about 90° at the knee, never lock out hard at the top.','leg press machine proper form'],
 rdl:['Romanian Deadlift (RDL)','Hamstrings · Glutes','Soft knees, push hips back, weight close to your legs. Stop when your hamstrings are stretched; keep a flat back.','romanian deadlift proper form'],
 thrust:['Hip Thrust','Glutes','Upper back on the bench, chin tucked. Drive through your heels and squeeze the top for 1 second.','barbell hip thrust proper form'],
 lunge:['Stationary Lunge','Quads · Glutes','Split stance. Drop straight down, back knee near the floor, drive through the front heel.','stationary lunge dumbbell proper form'],
 box:['Box Jump','Power · Legs','Log box height as the “weight”. Land soft, step down, reset every rep. Your “failure” is when jumps stop getting up to the box.','box jump proper form landing','n'],
 lext:['Leg Extension','Quads','Slow lowering, 1-second squeeze at the top. Don’t swing the weight up.','leg extension machine proper form'],
 pull:['Cable Pullover','Lats','Arms nearly straight, sweep the bar from overhead down to your thighs, ribs down.','cable pullover straight arm proper form'],
 ohp:['DB Overhead Press','Shoulders · Triceps','Core braced, press straight up, don’t arch your lower back.','dumbbell overhead press proper form']};
const LIFT={
 upper:[['',['pullup','row','incline','fly','raise',['curl','push']]]],
 lower:[['',['lpress','rdl','thrust','lunge','box','lext']]],
 full:[['Part 1 · Legs',['lpress','rdl','thrust']],['Part 2 · Back',['pullup','row','pull']],['Part 3 · Push',['incline','ohp','ROT']]]};
const rot=w=>(((w-NEW)>>1)%2===0)?'fly':'raise'; // 2 weeks pec fly, 2 weeks cable side raise
// beginner run/walk progression: [jog min, walk min, rounds, jog mph], advances every 2 weeks
const STAGES=[[1,2,5,4.5],[2,2,4,4.5],[3,2,4,5],[4,1,4,5],[5,1,3,5.5],[8,1,3,5.5]];
function plan(w){const [j,k,r,sp]=STAGES[Math.min(5,Math.max(0,(w-NEW)>>1))];return{j,k,r,sp,walk:j<3?2.5:3,tot:10+(j+k)*r}}
const DRILLS=[
 ['Ball handling',['Stationary pound dribbles · 30s each hand','Crossovers · 30s','Between-the-legs · 30s','Figure-8s · 30s','Two-ball dribble · 30s','Repeat 3 rounds'],'basketball ball handling drills at home'],
 ['Shooting form',['Form shots one-hand, close range · 20','5 spots × 10 makes','Free throws · 25','Catch-and-shoot off a self-pass · 20'],'basketball shooting form drills at home'],
 ['Layups & finishing',['Mikan drill · 3 × 10 each side','Right-hand layups · 10','Left-hand layups · 10','Two-step approach, off the correct foot · 10 each side','Reverse layups · 5 each side','Jump stops + pivots · 2 × 10'],'basketball layup drills at home']];

// ===== OLD PROGRAM (weeks 1–16): kept so past weeks look exactly like they did =====
const SESL=[
 {id:'push',tab:'Push',L:'P',name:'Push · Chest, Shoulders, Triceps',c:'--fu',t:'leg'},
 {id:'pull',tab:'Pull',L:'PL',name:'Pull · Back, Biceps',c:'--up',t:'leg'},
 {id:'legs',tab:'Legs',L:'L',name:'Legs · Explosiveness + Bounce',c:'--lo',t:'leg'}];
const EXL={
 push:[
  ['DB / Machine Chest Press','4 × 10','Control the weight on the way down: 2 seconds down, explode up. Keep your back flat against the bench or floor.','dumbbell chest press form tutorial'],
  ['Incline DB Press or Machine','3 × 10','Targets upper chest. Set the bench to 30–45 degrees. Don’t let your elbows flare out too wide.','incline dumbbell press form'],
  ['Shoulder Press Machine','3 × 10','Sit tall, core tight. Press straight up and don’t arch your lower back. Great for shoulder stability, which helps your jump shot arc.','machine shoulder press tutorial'],
  ['Cable Lateral Raises','3 × 12','Slow is the key here. Raise to shoulder height, hold 1 second, lower slowly. Don’t swing.','cable lateral raise form tutorial'],
  ['Tricep Pushdown (Cable)','3 × 12','Keep your elbows tucked to your sides the entire movement. Full extension at the bottom, squeeze.','tricep pushdown cable form'],
  ['Push-ups (Bodyweight)','2 × max','Finisher: go until you can’t. Straight body, chest to floor. Even 5 counts. These build up fast.','proper push up form beginner']],
 pull:[
  ['Lat Pulldown (Machine)','4 × 10','Wide grip. Pull the bar to your upper chest, not your neck. Lean back slightly, squeeze your lats at the bottom.','lat pulldown proper form wide grip'],
  ['Seated Cable Row','4 × 10','Sit tall. Pull to your belly button, squeeze your shoulder blades together like you’re cracking a walnut. This is your main back builder.','seated cable row form tutorial'],
  ['Machine Row or DB Row','3 × 10/side','Pull with your elbow, not your hand. Think of your hand as a hook. Drive your elbow back past your body.','dumbbell row one arm form'],
  ['Face Pulls (Cable)','3 × 15','Set cable at head height. Pull toward your face, elbows high. Great for fixing posture and protecting your shoulders. Do not skip this.','face pulls cable form posture'],
  ['Bicep Curl (DB or Cable)','3 × 12','Don’t swing your body. Full range: all the way down, all the way up. Wrist stability from this helps your jump shot.','dumbbell bicep curl proper form'],
  ['Assisted Pull-up Machine','3 × 8','Use enough assistance to complete clean reps. Reduce the assist weight every 2–3 weeks. Best back exercise there is.','assisted pull up machine how to use']],
 legs:[
  ['Leg Press Machine','4 × 10','Full range of motion: lower until your knees are at 90 degrees. Feet shoulder-width. Don’t lock your knees at the top.','leg press machine form tutorial'],
  ['Romanian Deadlift (DB)','3 × 10','Hinge at the hips, push your butt back, feel the stretch in your hamstrings. These build the muscles that launch you off the floor.','romanian deadlift dumbbell form'],
  ['Leg Curl Machine','3 × 12','Slow on the way back down. Your hamstrings power your jump, so this is one of the most important exercises for your bounce.','lying leg curl machine form'],
  ['Goblet Squat (DB)','3 × 10','Hold DB at chest. Sit into the squat, chest up. Then explode up. The upward explosion trains your fast-twitch fibers for jumping.','goblet squat dumbbell form tutorial'],
  ['Jump Squats (Bodyweight)','4 × 8','Squat to parallel, explode up as high as you can, land soft. Quality over speed. This is pure bounce training.','jump squats form for vertical jump'],
  ['Box Jumps or Broad Jumps','3 × 6','Land soft: bend your knees on landing. The landing matters as much as the jump. Full reset between reps.','box jump form how to land safely'],
  ['Calf Raises (Machine or Standing)','3 × 15','Full range: all the way up on your toes, all the way down for a stretch. Your calves are the spring in your jump. Don’t skip these.','standing calf raise form vertical jump']]};
function cardioPhaseL(w){return w<=3?'🏃 Cardio: 1 min jog → 2 min walk × 6 rounds':w<=6?'🏃 Cardio: 2 min jog → 1 min walk × 6 rounds':'🏃 Cardio: Sustain 10–15 min jog straight!'}
function cardioDetailL(w){return w<=3?'Walk 5 min to warm up, then alternate: 1 min jog / 2 min walk × 6 rounds. Finish with a 5 min walk. You’ve got this.':w<=6?'Walk 5 min to warm up, then: 2 min jog / 1 min walk × 6 rounds. Last 2 rounds, push the jog a little faster.':'Walk 5 min to warm up, then jog continuously for 10–15 minutes without stopping. Huge milestone.'}

// ============ STATE ============
const LS=localStorage,$=id=>document.getElementById(id);
const gj=(k,d)=>{try{return JSON.parse(LS.getItem(k))||d}catch(e){return d}};
const getW=n=>Object.assign({st:{},lg:{},ck:{},ch:{},dr:{},cl:{}},gj('week_'+n,{}));
const putW=(n,o)=>LS.setItem('week_'+n,JSON.stringify(o));
const startDate=()=>new Date(LS.getItem('startDate')||'2026-06-09');
const realWeek=()=>{const d=Date.now()-startDate();return d<0?1:Math.floor(d/6048e5)+1};
const maxWeek=()=>Math.max(realWeek(),NEW);
const stOf=(W,id)=>W.st[id]||(W[id]===true?{s:'done',d:W[id+'Date']}:null);
function getOrder(w){const o=getW(w).or;return o&&o.length===6?o:(w>NEW?getOrder(w-1):DEFAULT_ORDER)}
const sesList=w=>w>=NEW?getOrder(w).map(id=>SES.find(x=>x.id===id)):SESL;
let vw=maxWeek(),tab='upper';const OPEN=new Set();
const fmt=s=>new Date(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const weekDates=w=>{const a=startDate();a.setDate(a.getDate()+(w-1)*7);const b=new Date(a);b.setDate(b.getDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});return f(a)+' – '+f(b)};
const kid=k=>'c_'+k.replace(':','_');

// last logged weights for an exercise (this week's other sessions count too)
function last(id,w,sess){for(let k=w;k>=NEW;k--){const lg=getW(k).lg;for(const s of ['upper','lower','full']){if(k===w&&s===sess)continue;const v=lg[s+':'+id];if(v&&v.some(x=>x!==''))return v}}return null}
const sug=(v,e)=>v.map(x=>x===''||e[4]==='n'?x:String(Math.max(0,+x+(e[4]==='a'?-5:5))));

// ============ RENDER ============
function renderAll(){renderBanner();renderTabs();renderMain()}
function fixTab(){const l=sesList(vw);if(tab!=='history'&&tab!=='settings'&&!l.some(x=>x.id===tab)){const W=getW(vw);tab=(l.find(x=>!stOf(W,x.id))||l[0]).id}}
function dotsHTML(w,W){return sesList(w).map(x=>{const st=stOf(W,x.id);return `<div class="dot ${st?st.s:''}" style="--c:var(${x.c})" title="${x.name}">${st?'✓':x.L}</div>`}).join('')}
function renderBanner(){
  fixTab();
  const W=getW(vw),p=plan(vw);
  $('wl').textContent='Week '+vw;
  $('ph').textContent=vw>=NEW?`Run/walk this week: jog ${p.j} min / walk ${p.k} min × ${p.r}`:cardioPhaseL(vw);
  $('back').disabled=vw<=1;$('fwd').disabled=vw>=maxWeek();
  $('note').innerHTML=vw!==maxWeek()?`📍 Viewing a past week${vw<NEW?' · old Push/Pull/Legs plan':''} <button onclick="vw=maxWeek();renderAll()">Jump to current (Week ${maxWeek()})</button>`:'';
  $('dots').innerHTML=dotsHTML(vw,W);
}
function renderTabs(){
  fixTab();
  $('tabs').innerHTML=sesList(vw).map(x=>`<button class="tab ${tab===x.id?'on':''}" style="--c:var(${x.c})" onclick="go('${x.id}')">${x.tab}</button>`).join('')+
   `<button class="tab ${tab==='history'?'on':''}" onclick="go('history')">📅 History</button><button class="tab ${tab==='settings'?'on':''}" onclick="go('settings')">⚙️ Settings</button>`;
}
function go(t){tab=t;renderTabs();renderMain();scrollTo(0,0)}
function renderMain(){
  $('main').innerHTML=tab==='history'?histHTML():tab==='settings'?settingsHTML():sessHTML(sesList(vw).find(x=>x.id===tab));
}
function sessHTML(s){
  const W=getW(vw),st=stOf(W,s.id),l=sesList(vw),n=l.indexOf(s)+1;
  let h=`<div class="badge" style="--c:var(${s.c})">DAY ${n} — ${s.name.toUpperCase()}</div>`;
  if(s.t==='cardio')h+=`<div class="mv"><button onclick="move('${s.id}',-1)" ${n===1?'disabled':''}>◀ Earlier</button><span>Move this cardio day</span><button onclick="move('${s.id}',1)" ${n===l.length?'disabled':''}>Later ▶</button></div>`;
  if(st)h+=`<div class="status ${st.s==='sick'?'sick':''}"><div>${st.s==='sick'?'🤒 Sick day logged':'✓ Completed'}<small>${st.d?fmt(st.d):''}</small></div><button onclick="mark('${s.id}',null)">Undo</button></div>`;
  if(s.t==='lift')h+=`<div class="scheme"><b>Every exercise · 3 sets</b>Set 1: 10–12 reps (warm-up). Set 2: 6–8 reps, leave 2–3 in the tank. Set 3: 4–6 reps, go to failure (0 left). Log the weight for each set.</div>`+liftHTML(s,W);
  else if(s.t==='cardio')h+=cardioHTML(s,W);
  else h+=legHTML(s,W);
  if(!st)h+=`<div class="act"><button class="cbtn" style="--c:var(${s.c})" onclick="mark('${s.id}','done')">COMPLETE</button><button class="sbtn" onclick="mark('${s.id}','sick')">🤒 Sick day</button></div>`;
  return h;
}
function liftHTML(s,W){
  return LIFT[s.id].map(([h,ids])=>(h?`<div class="sec">${h}</div>`:'')+ids.map(x=>Array.isArray(x)
   ?`<div class="ss"><div class="sst">⚡ SUPERSET — alternate sets back to back</div>${x.map(y=>exCard(s,y,W)).join('')}</div>`
   :exCard(s,x,W)).join('')).join('');
}
function exCard(s,id,W){
  const isRot=id==='ROT';if(isRot)id=rot(vw);
  const e=EX[id],key=s.id+':'+id,v=W.lg[key]||['','',''],l=last(id,vw,s.id),sg=l&&sug(l,e),done=W.ck[key];
  const sub=e[1]+(isRot?' · 2-week rotation':'')+(l?` · last ${l.filter(x=>x!=='').join('/')}`:'');
  return `<div class="card ${done?'ok':''} ${OPEN.has(key)?'open':''}" id="${kid(key)}">
   <div class="ch" onclick="tg('${key}')"><div class="chk" onclick="event.stopPropagation();ck('${key}')">${done?'✓':''}</div><div class="ci"><div class="cn">${e[0]}</div><div class="cs">${sub}</div></div><div class="ar">▼</div></div>
   <div class="cd">
    ${[0,1,2].map(i=>`<div class="sr"><div class="sl"><b>Set ${i+1}</b><span>${REPS[i]}</span></div><input type="number" inputmode="decimal" step="2.5" min="0" placeholder="${sg&&sg[i]!==''?sg[i]:'lb'}" value="${v[i]}" onchange="lg('${key}',${i},this.value)"></div>`).join('')}
    <div class="sug">${sg?`Last: <b>${l.map(x=>x||'–').join(' / ')}</b> → suggested <b>${sg.map(x=>x||'–').join(' / ')}</b><button onclick="useSug('${key}')">Use</button>`:'No past weights yet. Log today and next time you’ll get a suggestion.'} You can always type your own.</div>
    <div class="tip">💡 ${e[2]}</div>
    <a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[3])}">▶ YouTube tutorial</a>
   </div></div>`;
}
function runHTML(p){
  return `<div class="card2"><h3>Run / Walk · beginner intervals</h3><ol><li>5 min warm-up walk @ ${p.walk} mph</li><li><b>${p.r} rounds:</b> jog ${p.j} min @ ${p.sp} mph, then walk ${p.k} min @ ${p.walk} mph</li><li>5 min cool-down walk @ 2.5 mph</li></ol><p class="m">About ${p.tot} min total. The jog gets longer every 2 weeks. Speeds are a guide: if you can’t talk in short sentences, slow down.</p></div>`;
}
function cardioHTML(s,W){
  const ch=W.ch[s.id]||'walk',o=[['walk','🚶 Walk'],['run','🏃 Run/Walk'],['hoops','🏀 Run + Hoops']];
  return `<div class="seg">${o.map(([k,t])=>`<button class="${ch===k?'on':''}" onclick="pick('${s.id}','${k}')">${t}</button>`).join('')}</div>`+
   (ch==='walk'?`<div class="card2"><h3>45-minute walk</h3>Treadmill <b>level 3 or above</b> for the full 45 minutes. Steady pace, no holding the rails if you can help it.</div>`
   :ch==='run'?runHTML(plan(vw))
   :`<div class="m" style="margin:0 0 8px">Step 1 · run first</div>`+runHTML(plan(vw))+bbHTML(s));
}
function bbHTML(s){
  const W=getW(vw),pk=W.dr[s.id]||LS.getItem('drill_'+s.id)||'2',names=['Ball handling','Shooting','Layups','Class workout'];
  let body;
  if(pk==='3')body=`<div class="card2"><h3>Class workout</h3><textarea style="width:100%;min-height:110px;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit;font-size:14px" placeholder="Type what your teacher assigned (drills, reps, sets)…" onchange="saveCl('${s.id}',this.value)">${(W.cl[s.id]||'').replace(/</g,'&lt;')}</textarea><p class="m">Saved for this day, so you can see what you did later.</p></div>`;
  else{const d=DRILLS[+pk===2?2:+pk];body=`<div class="card2"><h3>${d[0]}</h3><ul style="padding-left:18px">${d[1].map(x=>`<li>${x}</li>`).join('')}</ul><p class="m"><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(d[2])}">▶ YouTube drills</a></p></div>`}
  return `<div class="m" style="margin:0 0 8px">Step 2 · pick your hoops work (I’ll remember your pick)</div><div class="seg" style="flex-wrap:wrap">${names.map((n,i)=>`<button style="flex:1 1 45%" class="${pk==i?'on':''}" onclick="pickDrill('${s.id}','${i}')">${n}</button>`).join('')}</div>`+body;
}
function pickDrill(id,v){const W=getW(vw);W.dr[id]=v;putW(vw,W);LS.setItem('drill_'+id,v);renderMain()}
function saveCl(id,v){const W=getW(vw);W.cl[id]=v;putW(vw,W)}
function legHTML(s,W){
  return `<div class="card2"><h3>🏃 Off-day cardio reminder</h3>${cardioDetailL(vw)}</div>`+EXL[s.id].map((e,i)=>{
   const key=s.id+':'+i,done=W.ck[key];
   return `<div class="card ${done?'ok':''} ${OPEN.has(key)?'open':''}" id="${kid(key)}"><div class="ch" onclick="tg('${key}')"><div class="chk" onclick="event.stopPropagation();ck('${key}')">${done?'✓':''}</div><div class="ci"><div class="cn">${e[0]}</div><div class="cs">${e[1]}</div></div><div class="ar">▼</div></div><div class="cd"><div class="tip">💡 ${e[2]}</div><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[3])}">▶ YouTube tutorial</a></div></div>`}).join('');
}
function histHTML(){
  let h='',done=0,sick=0,wks=0;
  for(let w=maxWeek();w>=1;w--){
    if(w<NEW&&LS.getItem('week_'+w)===null)continue;
    const W=getW(w),l=sesList(w),ts=l.map(x=>stOf(W,x.id));
    const n=ts.filter(t=>t&&t.s==='done').length,k=ts.filter(t=>t&&t.s==='sick').length;
    done+=n;sick+=k;if(n+k)wks++;
    const dates=w<NEW?`<div style="font-size:12px;color:var(--mu);line-height:1.8;margin-top:10px">${l.map((x,i)=>ts[i]&&ts[i].d?`${x.tab}: ${fmt(ts[i].d)}`:'').filter(Boolean).join('<br>')}</div>`:'';
    h+=`<div class="hw"><div class="ht"><div><b>Week ${w}</b><small>${weekDates(w)} · ${n}/${l.length} done${k?` · ${k} sick`:''}${w<NEW?' · old Push/Pull/Legs':''}</small></div><button onclick="openWeek(${w})">Open</button></div><div class="dots" ${w<NEW?'style="justify-content:flex-start"':''}>${dotsHTML(w,W)}</div>${dates}</div>`;
  }
  return `<div class="stats"><div><b>${done}</b>sessions done</div><div><b>${sick}</b>sick days</div><div><b>${wks}</b>weeks active</div></div>`+h;
}
function settingsHTML(){
  const st=LS.getItem('startDate')||'2026-06-09',rt=LS.getItem('reminderTime')||'10:00';
  const np='Notification' in window?Notification.permission:'none';
  return `<div class="set"><h3>🌗 Appearance</h3><p>Switch any time with the ☀️/🌙 button in the top bar too.</p><button class="sb alt" onclick="setTheme('light')">☀️ Light mode</button><button class="sb alt" onclick="setTheme('dark')">🌙 Dark mode</button></div>
  <div class="set"><h3>📅 Start date (Week 1)</h3><p>The new program begins at Week ${NEW}. Set this so your week numbers line up.</p><input type="date" value="${st}" onchange="LS.setItem('startDate',this.value);vw=maxWeek();renderAll()"></div>
  <div class="set"><h3>🔔 Reminders</h3><p>A daily nudge at your chosen time if you still have sessions left this week.</p><input type="time" value="${rt}" onchange="LS.setItem('reminderTime',this.value);LS.removeItem('lastReminderDate')">
  <button class="sb" onclick="enableNotif()">${np==='granted'?'✓ Notifications on':np==='denied'?'Blocked in browser settings':np==='none'?'Not supported here':'Enable notifications'}</button></div>
  <div class="set"><h3>💾 Backup</h3><p>Your data lives in this browser. Export a copy now and then, or move it to a new phone.</p><button class="sb alt" onclick="exp()">Export backup</button><button class="sb alt" onclick="$('imp').click()">Import backup</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>`;
}

// ============ ACTIONS ============
function navWeek(d){vw=Math.min(maxWeek(),Math.max(1,vw+d));renderAll()}
function openWeek(w){vw=w;const W=getW(w),l=sesList(w);tab=(l.find(x=>!stOf(W,x.id))||l[0]).id;renderAll();scrollTo(0,0)}
function move(id,d){const o=getOrder(vw).slice(),i=o.indexOf(id),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];const W=getW(vw);W.or=o;putW(vw,W);renderAll()}
function tg(k){OPEN.has(k)?OPEN.delete(k):OPEN.add(k);$(kid(k)).classList.toggle('open')}
function ck(k){const W=getW(vw);W.ck[k]=!W.ck[k];putW(vw,W);const c=$(kid(k));c.classList.toggle('ok',W.ck[k]);c.querySelector('.chk').textContent=W.ck[k]?'✓':''}
function lg(k,i,v){const W=getW(vw),a=W.lg[k]||['','',''];a[i]=v;W.lg[k]=a;putW(vw,W)}
function useSug(k){const [s,id]=k.split(':'),W=getW(vw);W.lg[k]=sug(last(id,vw,s),EX[id]);putW(vw,W);renderMain()}
function pick(id,v){const W=getW(vw);W.ch[id]=v;putW(vw,W);renderMain()}
function mark(id,kind){
  const W=getW(vw);
  if(kind){W.st[id]={s:kind,d:new Date().toISOString()};if(kind==='done'){W[id]=true;W[id+'Date']=W.st[id].d}}
  else{delete W.st[id];W[id]=false;W[id+'Date']=null}
  putW(vw,W);renderAll();if(kind==='done')confetti();
}
function confetti(){
  const c=$('cf'),cols=['#e63946','#3a86ff','#2dc653','#9b5de5','#ffc233'];
  for(let i=0;i<50;i++){const p=document.createElement('div');p.className='cp';p.style.left=Math.random()*100+'vw';p.style.background=cols[i%5];p.style.animationDelay=Math.random()*.6+'s';c.appendChild(p);setTimeout(()=>p.remove(),3000)}
}
// rest timer
let rI=null;
function rest(n){
  clearInterval(rI);let t=n;const el=$('rt'),bar=$('rest');bar.classList.remove('go');
  const tick=()=>{if(t<=0){clearInterval(rI);el.textContent='Go! 💥';bar.classList.add('go');navigator.vibrate&&navigator.vibrate([300,150,300]);return}
    el.textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');t--};
  tick();rI=setInterval(tick,1000);
}
// theme
function setTheme(t){document.documentElement.setAttribute('data-theme',t);$('theme').textContent=t==='dark'?'☀️':'🌙';LS.setItem('theme',t)}
function toggleTheme(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
// backup
function exp(){const o={};for(let i=0;i<LS.length;i++){const k=LS.key(i);o[k]=LS.getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='grind-tracker-backup.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);for(const k in o)LS.setItem(k,o[k]);location.reload()})}
// notifications
async function enableNotif(){if(!('Notification' in window))return;await Notification.requestPermission();startRem();renderMain()}
function tryRemind(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const [h,m]=(LS.getItem('reminderTime')||'10:00').split(':').map(Number),now=new Date(),diff=now.getHours()*60+now.getMinutes()-(h*60+m);
  if(diff<0||diff>30||LS.getItem('lastReminderDate')===now.toDateString())return;
  const W=getW(realWeek()),left=sesList(realWeek()).filter(x=>!stOf(W,x.id));if(!left.length)return;
  LS.setItem('lastReminderDate',now.toDateString());
  new Notification('GRIND TRACKER 💪',{body:`Week ${realWeek()}: still to do: ${left.map(s=>s.tab).join(', ')}.`});
}
function startRem(){setInterval(tryRemind,3e5);setTimeout(tryRemind,3000)}

// ============ INIT ============
(function(){
  const n=new Date(),dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('hd').innerHTML=`<b>${dn[n.getDay()]}, ${mn[n.getMonth()]} ${n.getDate()}</b>${n.getFullYear()}`;
  setTheme(LS.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  
  renderAll();
  if('Notification' in window&&Notification.permission==='granted')startRem();
})();
</script>
</body>
</html>
